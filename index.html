<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LazyQuest</title>
<meta name="description" content="Learn LazyVim keybindings by playing: flash, mini.surround, mini.ai and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&family=Silkscreen&display=swap">
<style>
/* Layout: a single editor "world" framed like a terminal; quest panel to the right, stacks below on narrow screens.
   Deliberately single dark theme — tokyonight-night, LazyVim's default colourscheme. */
:root {
  color-scheme: dark;
  --void: #0e0e15;
  --bg: #1a1b26;
  --bg-dark: #16161e;
  --bg-float: #1f2335;
  --bg-hl: #292e42;
  --bg-visual: #283457;
  --fg: #c0caf5;
  --fg-dim: #a9b1d6;
  --muted: #737aa2;
  --comment: #565f89;
  --gutter: #3b4261;
  --border: #27a1b9;
  --blue: #7aa2f7;
  --cyan: #7dcfff;
  --purple: #bb9af7;
  --magenta: #ff007c;
  --green: #9ece6a;
  --orange: #ff9e64;
  --yellow: #e0af68;
  --red: #f7768e;
  --teal: #1abc9c;
  --match: #3d59a1;
  --gold: #ffc777;
  --font-display: 'Silkscreen', 'JetBrains Mono', ui-monospace, monospace;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cell: 1.55em;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  background-image: radial-gradient(circle at 1px 1px, #1d1f2e 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.app { min-height: 100%; padding-inline: 16px; padding-block: 18px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* ── top bar ── */
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.04em; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.brand .blk { display: inline-block; width: 0.62em; height: 1.05em; background: var(--blue); animation: blink 1.1s steps(1) infinite; }
.crumb { color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.crumb b { color: var(--fg); font-weight: 600; }
.spacer { flex: 1; }
.btn { background: var(--bg-hl); border: 1px solid #3b4261; color: var(--fg); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-family: var(--font-mono); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); color: var(--bg-dark); border-color: var(--blue); font-weight: 700; }
.btn kbd { font-size: 11px; opacity: 0.75; }
.meter { font-family: var(--font-mono); font-size: 13px; display: flex; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; }
.meter .keys b { color: var(--fg); }
.meter .keys { color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 2px; }
.stars .off { color: var(--gutter); }

/* ── level layout ── */
.level { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .level { grid-template-columns: minmax(0, 1fr); } }

/* ── editor ── */
.editor:focus { outline: none; box-shadow: 0 20px 60px -20px #000, 0 0 0 1px var(--blue); }
.editor { position: relative; background: var(--bg); border: 1px solid #101014; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px -20px #000, 0 0 0 1px #24283b; font-family: var(--font-mono); font-size: 14.5px; line-height: var(--cell); min-width: 0; }
.bufferline { display: flex; background: var(--bg-dark); border-bottom: 1px solid #101014; font-size: 12.5px; overflow-x: auto; }
.bufferline .tab { padding: 4px 14px; color: var(--comment); border-right: 1px solid #101014; white-space: nowrap; }
.bufferline .tab.on { color: var(--fg); background: var(--bg); box-shadow: inset 0 2px 0 var(--blue); }
.bufferline .tab .dot { color: var(--orange); margin-left: 6px; }
.bufferline .ghost { padding: 4px 14px; color: var(--gutter); font-style: italic; }
.buffer { padding: 6px 0 10px; min-height: 340px; max-height: 62vh; overflow: auto; position: relative; }
.row { display: flex; white-space: pre; min-height: var(--cell); }
.row.curline { background: var(--bg-hl); }
.gutter { width: 3.6em; flex: none; text-align: right; padding-right: 0.9em; color: var(--gutter); user-select: none; font-variant-numeric: tabular-nums; }
.row.curline .gutter { color: var(--orange); text-align: left; padding-left: 0.7em; font-weight: 700; }
.sign { width: 1.3em; flex: none; text-align: center; user-select: none; }
.sign.err { color: var(--red); }
.text { flex: none; }
.vt { color: var(--red); padding-left: 2.4em; opacity: 0.9; font-size: 0.92em; }
.vt.warn { color: var(--yellow); }
.c { position: relative; }
.t-kw { color: var(--purple); font-style: italic; }
.t-str { color: var(--green); }
.t-num { color: var(--orange); }
.t-com { color: var(--comment); font-style: italic; }
.t-fn { color: var(--blue); }
.t-prop { color: var(--teal); }
.t-op { color: #89ddff; }
.t-brk { color: #a9b1d6; }
.t-head { color: var(--blue); font-weight: 700; }
.t-punc { color: var(--orange); }
.t-err { color: var(--red); font-weight: 700; }
.t-warn { color: var(--yellow); }
.t-info { color: var(--cyan); }
.sel { background: var(--bg-visual); }
.srch { background: var(--match); color: var(--fg); }
.diag { text-decoration: underline wavy var(--red); text-underline-offset: 3px; }
.gem { color: #1a1b26 !important; background: radial-gradient(circle at 50% 45%, #fff3c4 0%, var(--gold) 45%, #d9902f 100%); border-radius: 3px; box-shadow: 0 0 10px #ffc77788; font-style: normal; animation: gem 1.6s ease-in-out infinite; }
.gem.blank::before { content: '◆'; position: absolute; left: 0; right: 0; text-align: center; font-size: 0.8em; }
.cur { background: var(--fg); color: var(--bg) !important; border-radius: 1px; }
.cur.gem { outline: 2px solid var(--fg); }
.cur.ins { background: none; color: inherit !important; box-shadow: inset 2px 0 0 var(--fg); }
.cur.idle { animation: blink 1.1s steps(1) infinite; }
.flash-on .text .c:not(.fm):not(.fl) { color: #545c7e !important; }
.fm { background: var(--match); color: var(--fg) !important; }
.fl { background: var(--magenta); color: #fff !important; font-weight: 800; }
.tsl { background: var(--magenta); color: #fff; font-weight: 800; padding: 0 2px; border-radius: 2px; margin: 0 1px; }
.tsr { background: #ff007c22; }

.statusline { display: flex; align-items: stretch; background: var(--bg-dark); font-size: 12.5px; border-top: 1px solid #101014; min-height: 24px; }
.statusline > span { padding: 2px 10px; display: flex; align-items: center; white-space: nowrap; }
.mode { font-weight: 800; color: var(--bg-dark); letter-spacing: 0.05em; }
.m-normal { background: var(--blue); }
.m-insert { background: var(--green); }
.m-visual, .m-vline { background: var(--purple); }
.m-command { background: var(--yellow); }
.m-pending { background: var(--cyan); }
.sl-file { color: var(--fg-dim); background: var(--bg-hl); }
.sl-fill { flex: 1; }
.sl-cmd { color: var(--orange); }
.sl-rec { color: var(--red); font-weight: 700; }
.sl-pos { color: var(--bg-dark); background: var(--blue); font-weight: 700; font-variant-numeric: tabular-nums; }
.cmdrow { min-height: 24px; padding: 2px 12px; font-size: 13px; color: var(--fg-dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.cmdrow.err { color: var(--red); }

/* floats */
.float { position: absolute; background: var(--bg-float); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 40px -8px #000c; z-index: 5; }
.float .ttl { position: absolute; top: -0.8em; left: 12px; background: var(--bg-float); color: var(--border); padding: 0 6px; font-size: 12px; line-height: 1.4; }
.noice { left: 50%; top: 22%; transform: translateX(-50%); width: min(560px, 86%); padding: 8px 12px; font-size: 14px; }
.noice .icon { color: var(--yellow); margin-right: 8px; font-weight: 700; }
.cmdrow .caret, .float .caret { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.15em; background: var(--fg); animation: blink 1.1s steps(1) infinite; }
.noice.search .icon { color: var(--cyan); }
.noice.search { border-color: var(--yellow); }
.noice.search .ttl { color: var(--yellow); }
.flashp { left: 0; right: 0; bottom: 50px; margin: 0 auto; width: max-content; padding: 2px 12px; border-color: var(--magenta); font-size: 13px; }
.whichkey { left: 10px; right: 10px; bottom: 54px; padding: 12px 14px 8px; font-size: 12.5px; line-height: 1.6; }
.whichkey .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 0 18px; }
.whichkey .it { display: flex; gap: 10px; min-width: 0; }
.whichkey .k { color: var(--yellow); font-weight: 700; min-width: 3.2em; text-align: right; flex: none; }
.whichkey .d { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.whichkey .d.grp { color: var(--purple); }
.whichkey .dim { opacity: 0.35; }
.whichkey .foot { margin-top: 6px; color: var(--comment); font-size: 11px; }
.picker { left: 50%; top: 10%; transform: translateX(-50%); width: min(720px, 92%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); font-size: 13px; }
@media (max-width: 560px) { .picker { grid-template-columns: minmax(0, 1fr); } .picker .pv { display: none; } }
.picker .pl { border-right: 1px solid #3b4261; min-width: 0; }
.picker .in { padding: 8px 12px; border-bottom: 1px solid #3b4261; color: var(--fg); }
.picker .in .p { color: var(--cyan); margin-right: 8px; }
.picker ul { list-style: none; margin: 0; padding: 4px 0; max-height: 240px; overflow: auto; }
.picker li { padding: 1px 12px; color: var(--fg-dim); white-space: nowrap; }
.picker li.on { background: var(--bg-hl); color: var(--fg); box-shadow: inset 2px 0 0 var(--cyan); }
.picker li .hl { color: var(--cyan); font-weight: 700; }
.picker .pv { padding: 8px 12px; white-space: pre; color: var(--fg-dim); overflow: hidden; font-size: 12px; min-height: 160px; }
.popup { padding: 6px 10px; font-size: 12.5px; max-width: 70%; white-space: normal; }
.popup.err { border-color: var(--red); }
.notify { right: 10px; top: 40px; padding: 8px 12px; font-size: 12.5px; border-color: var(--green); max-width: 60%; animation: fadeout 3.2s forwards; }
.notify.err { border-color: var(--red); }
.toast { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); background: var(--bg-dark); border: 1px solid var(--red); color: var(--fg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 8; animation: fadeout 1.8s forwards; pointer-events: none; }
.toast b { color: var(--red); }
.sparkle { position: absolute; color: var(--gold); font-weight: 800; pointer-events: none; z-index: 6; animation: rise 0.9s ease-out forwards; text-shadow: 0 0 8px #ffc777; }
.focuscover { position: absolute; inset: 0; background: #0e0e15cc; display: flex; align-items: center; justify-content: center; z-index: 9; cursor: pointer; font-family: var(--font-display); font-size: 15px; color: var(--fg); text-align: center; padding: 20px; }

/* ── quest panel ── */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--bg-dark); border: 1px solid #24283b; border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; color: var(--comment); text-transform: uppercase; }
.lvtitle { font-family: var(--font-display); font-size: 20px; line-height: 1.2; margin: 0 0 6px; color: var(--fg); text-wrap: balance; }
.speaker { display: flex; gap: 10px; align-items: flex-start; }
.owl { flex: none; width: 34px; height: 34px; image-rendering: pixelated; }
.story { color: var(--fg-dim); margin: 0; max-width: 65ch; }
.goal { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; background: #1abc9c14; border: 1px solid #1abc9c44; color: var(--fg); font-size: 14px; }
.goal b { color: var(--teal); font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.06em; margin-right: 6px; }
.teach { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
.kc { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg-hl); border: 1px solid #3b4261; border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; color: var(--yellow); white-space: nowrap; }
.teach .d { color: var(--fg-dim); font-size: 13.5px; }
.sealed { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.sealed .kc { color: var(--red); text-decoration: line-through; }
.target pre { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; overflow-x: auto; }
.target .ln { display: block; padding-left: 1.4em; position: relative; white-space: pre; }
.target .ln::before { position: absolute; left: 0; content: '·'; color: var(--gutter); }
.target .ln.ok { color: var(--green); }
.target .ln.ok::before { content: '✓'; color: var(--green); }
.target .ln.bad { color: var(--fg); }
.target .ln.bad::before { content: '✗'; color: var(--red); }
.target .fname { color: var(--comment); font-size: 11.5px; margin: 6px 0 2px; font-family: var(--font-mono); }
.gemcount { font-family: var(--font-mono); font-size: 13px; color: var(--fg-dim); }
.gemcount .g { color: var(--gold); }
.gemcount .g.off { color: var(--gutter); }
.helprow { display: flex; gap: 8px; flex-wrap: wrap; }
.hinttext { margin: 10px 0 0; color: var(--fg-dim); font-size: 13.5px; }
.solution { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }

/* ── title ── */
.title { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 4vh 2vh; }
@media (max-width: 860px) { .title { grid-template-columns: minmax(0, 1fr); } }
.logo { font-family: var(--font-display); font-size: clamp(44px, 8vw, 92px); line-height: 0.95; margin: 0; letter-spacing: 0.01em; }
.logo .z { color: var(--blue); }
.logo .q { color: var(--fg); }
.tag { font-size: 18px; color: var(--fg-dim); max-width: 46ch; margin: 18px 0 22px; }
.tag b { color: var(--cyan); font-weight: 600; }
.cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cta .btn { font-size: 14px; padding: 8px 16px; }
.settings { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; color: var(--fg-dim); font-size: 14px; }
.settings label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.settings input { accent-color: var(--blue); width: 16px; height: 16px; }
.settings small { color: var(--comment); }
.demo { font-family: var(--font-mono); font-size: 14px; background: var(--bg); border-radius: 10px; box-shadow: 0 20px 60px -20px #000, 0 0 0 1px #24283b; overflow: hidden; }
.demo .row { padding-right: 12px; }
.note { color: var(--comment); font-size: 13px; margin-top: 14px; max-width: 60ch; }

/* ── map ── */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 14px; }
.chapter { background: var(--bg-dark); border: 1px solid #24283b; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chapter .cn { font-family: var(--font-display); font-size: 11px; color: var(--comment); letter-spacing: 0.08em; }
.chapter h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--fg); }
.chapter p { margin: 0; color: var(--muted); font-size: 13.5px; }
.tiles { display: flex; flex-direction: column; gap: 6px; }
.tile { display: grid; grid-template-columns: 2.6em 1fr auto; gap: 8px; align-items: center; text-align: left; background: var(--bg); border: 1px solid #24283b; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13.5px; }
.tile .id { font-family: var(--font-mono); color: var(--comment); font-size: 12px; }
.tile .nm { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .stars { font-size: 12px; }
.tile.locked { opacity: 0.45; cursor: not-allowed; }
.tile.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 0 18px -4px var(--blue); }
.tile.done .id { color: var(--green); }
.maphead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.maphead h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.maphead .sub { color: var(--muted); font-size: 14px; }

/* ── codex ── */
.codex { columns: 3 260px; column-gap: 14px; }
.codex .card { break-inside: avoid; margin-bottom: 14px; }
.codex .locked { opacity: 0.35; }

/* ── modal ── */
.modal { position: fixed; inset: 0; background: #0e0e15d9; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.win { background: var(--bg-dark); border: 1px solid var(--gold); border-radius: 14px; padding: 26px 30px; width: min(460px, 100%); text-align: center; box-shadow: 0 0 80px -20px #ffc77766; animation: pop 0.35s ease-out; }
.win h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 6px; color: var(--gold); }
.win .bigstars { font-size: 40px; letter-spacing: 8px; color: var(--gold); }
.win .bigstars .off { color: var(--gutter); }
.win p { color: var(--fg-dim); margin: 8px 0; }
.win .learned { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 18px; }
.win .row2 { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.mobile-note { display: none; background: var(--bg-dark); border: 1px solid var(--yellow); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
@media (pointer: coarse) and (max-width: 820px) { .mobile-note { display: block; } }

@keyframes blink { 50% { opacity: 0; } }
@keyframes gem { 0%, 100% { box-shadow: 0 0 6px #ffc77766; } 50% { box-shadow: 0 0 14px #ffc777cc; } }
@keyframes fadeout { 0%, 75% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
/* LazyQuest editor engine — a small, testable Vim + LazyVim emulator.
   Keys are strings: printable chars as themselves, specials as <Esc> <CR> <BS> <Tab> <C-r> <A-j> ...
   Leader is a literal space " ". */
(function (G) {
  'use strict';

  const isWS = (ch) => ch === ' ' || ch === '\t';
  const isKW = (ch) => ch !== undefined && /[A-Za-z0-9_]/.test(ch);
  function cls(ch, big) {
    if (ch === undefined || isWS(ch)) return 0;
    if (big) return 1;
    return isKW(ch) ? 2 : 1;
  }
  const indentOf = (s) => s.match(/^\s*/)[0];
  const fnbCol = (s) => {
    const m = s.search(/\S/);
    return m < 0 ? Math.max(0, s.length - 1) : m;
  };
  const OPEN = { '(': ')', '[': ']', '{': '}', '<': '>' };
  const CLOSE = { ')': '(', ']': '[', '}': '{', '>': '<' };
  const QUOTES = '"\'`';
  const LABELS = 'asdfghjklqwertyuiopzxcvbnm';
  const FT = { js: 'javascript', ts: 'typescript', lua: 'lua', py: 'python', sh: 'sh', md: 'markdown', txt: 'text', toml: 'toml', log: 'log', csv: 'text' };
  const COMMENT = { javascript: '//', typescript: '//', lua: '--', python: '#', sh: '#', text: '#', markdown: '>', toml: '#', log: '#' };
  const ftOf = (name) => FT[(name.split('.').pop() || '').toLowerCase()] || 'text';

  // Convert a (magic) Vim regex into a JS RegExp source.
  function vimRe(p) {
    let out = '';
    for (let i = 0; i < p.length; i++) {
      const ch = p[i];
      if (ch === '\\' && i + 1 < p.length) {
        const n = p[++i];
        if (n === '<' || n === '>') out += '\\b';
        else if ('()|+?={}'.includes(n)) out += n === '=' ? '?' : n;
        else out += '\\' + n;
      } else if ('()|+?{}'.includes(ch)) out += '\\' + ch;
      else out += ch;
    }
    return out;
  }
  function vimRep(r) {
    let out = '';
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];

      const pairs = this.pairsFor(k);
      if (!pairs) return null;
      const p = this.pickPair(pairs, at, method);
      if (!p) return null;
      if (!inner) return { kind: 'char', s: p.o, e: p.c + 1 };
      let s = p.o + 1,
        e = p.c;
      if (OPEN[k] && k !== '<') {
        const t = this.text();
        while (s < e && /\s/.test(t[s])) s++;
        while (e > s && /\s/.test(t[e - 1])) e--;
      }
      return { kind: 'char', s, e };
    }
    argRange(inner, at, method) {
      const t = this.text();
      const trim = ([a, b]) => {
        while (a < b && /\s/.test(t[a])) a++;
        while (b > a && /\s/.test(t[b - 1])) b--;
        return [a, b];
      };
      const cands = [];
      for (const p of this.bracketPairs('([{')) {
        if (t.slice(p.o + 1, p.c).trim() === '') continue;
        const spans = [];
        let depth = 0,
          quote = null,
          st = p.o + 1;
        for (let i = p.o + 1; i < p.c; i++) {
          const ch = t[i];
          if (quote) {
            if (ch === quote && t[i - 1] !== '\\') quote = null;
            continue;
          }
          if (QUOTES.includes(ch)) quote = ch;
          else if ('([{'.includes(ch)) depth++;
          else if (')]}'.includes(ch)) depth--;
          else if (ch === ',' && depth === 0) {
            spans.push([st, i]);
            st = i + 1;
          }
        }
        spans.push([st, p.c]);
        spans.forEach((sp, i) => {
          const [a, b] = trim(sp);
          let oa = a,
            ob = b;
          if (spans.length > 1) {
            if (i > 0) oa = trim(spans[i - 1])[1];
            else ob = sp[1] + 1;
          }
          cands.push({ o: sp[0], c: Math.max(sp[0], sp[1] - 1), ia: a, ib: b, oa, ob });
        });
      }
      const p = this.pickPair(cands, at, method);
      if (!p) return null;
      return inner ? { kind: 'char', s: p.ia, e: p.ib } : { kind: 'char', s: p.oa, e: p.ob };
    }

    // ---------- range helpers ----------
    rangeFrom(m) {
      const { r, c } = this.cur;
      if (m.type === 'line') return { kind: 'line', r1: Math.min(r, m.r), r2: Math.max(r, m.r) };
      let a = { r, c },
        b = { r: m.r, c: m.c };
      if (b.r < a.r || (b.r === a.r && b.c < a.c)) [a, b] = [b, a];
      if (m.type === 'incl') {
        const len = this.L[b.r].length;
        if (m.nl && len === 0 && b.r < this.L.length - 1) return { kind: 'char', s: this.off(a.r, a.c), e: this.off(b.r, 0) + 1 };
        return { kind: 'char', s: this.off(a.r, a.c), e: this.off(b.r, Math.min(len, b.c + 1)) };
      }
      if (b.c === 0 && b.r > a.r) {
        if (a.c <= indentOf(this.L[a.r]).length) return { kind: 'line', r1: a.r, r2: b.r - 1, fnb: true };
        return { kind: 'char', s: this.off(a.r, a.c), e: this.off(b.r - 1, this.L[b.r - 1].length) };
      }
      return { kind: 'char', s: this.off(a.r, a.c), e: this.off(b.r, b.c) };
    }
    rangeText(rg) {
      if (rg.kind === 'line') return this.L.slice(rg.r1, rg.r2 + 1).join('\n');
      return this.text().slice(rg.s, rg.e);
    }
    deleteRange(rg, reg, noReg) {
      const L = this.L;
      if (rg.kind === 'line') {
        const removed = L.splice(rg.r1, rg.r2 - rg.r1 + 1);
        if (!noReg) this.setReg(reg, removed.join('\n'), true);
        if (!L.length) L.push('');
        const nr = Math.min(rg.r1, L.length - 1);
        if (rg.fnb) this.setCur(nr, fnbCol(L[nr]));
        else this.setCur(nr, this.wantCol(nr), true);
        return;
      }
      const t = this.text();
      if (!noReg) this.setReg(reg, t.slice(rg.s, rg.e), false);
      this.setText(t.slice(0, rg.s) + t.slice(rg.e));
      const p = this.pos(rg.s);
      this.setCur(p.r, p.c);
    }

    // ---------- the normal-mode command ----------
    *normalCmd() {
      this.mode = 'normal';
      let k = yield 'cmd';
      let reg = null;
      if (k === '"') {
        reg = yield 'text';
        k = yield 'cmd';
      }
      let count = 0;
      while (/^[1-9]$/.test(k) || (count && k === '0')) {
        count = count * 10 + +k;
        k = yield 'cmd';
      }
      const n = count || 1;
      const wasChar = this.charActive;
      this.charActive = false;
      this.popup = null;
      if (k !== ':' ) this.msg = this.msg && k === '<Esc>' ? '' : this.msg;
      const L = this.L;
      const b = this.buf;

      if (wasChar && this.lastFind && k.length === 1 && 'fFtT'.includes(k) && k.toLowerCase() === this.lastFind.k.toLowerCase()) {
        const m = this.repeatFind(k, n);
        if (m) {
          this.moveTo(m);
          this.charActive = true;
        }
        return;
      }

      switch (k) {
        case '<Esc>':
          this.hl = false;
          this.msg = '';
          return;
        case 'i':
          return yield* this.insert();
        case 'a':
          if (L[b.r].length) b.c++;
          return yield* this.insert();
        case 'I':
          b.c = L[b.r].trim() === '' ? L[b.r].length : fnbCol(L[b.r]);
          return yield* this.insert();
        case 'A':
          b.c = L[b.r].length;
          return yield* this.insert();
        case 'o':
        case 'O': {
          const ind = indentOf(L[b.r]) + (k === 'o' && this.opensBlock(L[b.r]) ? '  ' : '');
          const at = k === 'o' ? b.r + 1 : b.r;
          L.splice(at, 0, ind);
          b.r = at;
          b.c = ind.length;
          this.aiLine = at;
          return yield* this.insert();
        }
        case 'v':
        case 'V':
          return yield* this.visual(k === 'V' ? 'line' : 'char');
        case 'x':
        case 'X': {
          if (!L[b.r].length) return;
          const m = k === 'x' ? { r: b.r, c: Math.min(L[b.r].length, b.c + n), type: 'excl' } : { r: b.r, c: Math.max(0, b.c - n), type: 'excl' };
          const rg = this.rangeFrom(m);
          if (rg.s === rg.e) return;
          this.deleteRange(rg, reg);
          return;
        }
        case 'D':
        case 'C':
        case 'Y': {
          const r2 = Math.min(L.length - 1, b.r + n - 1);
          const rg = { kind: 'char', s: this.off(b.r, b.c), e: this.off(r2, L[r2].length) };
          if (k === 'Y') {
            this.setReg(reg, this.rangeText(rg), false, true);
            return;
          }
          this.deleteRange(rg, reg);
          if (k === 'C') return yield* this.insert();
          this.setCur(b.r, b.c);
          return;
        }
        case 'p':
        case 'P':
          this.paste(k === 'p', n, reg);
          return;
        case 'u':
          this.noUndo = true;
          this.undo(n);
          return;
        case '<C-r>':
          this.noUndo = true;
          this.redoN(n);
          return;
        case '.': {
          if (!this.lastChange) return;
          let keys = this.lastChange.slice();
          if (count) {
            let i = 0;
            if (keys[0] === '"') i = 2;
            let j = i;
            while (j < keys.length && /^[0-9]$/.test(keys[j]) && !(j === i && keys[j] === '0')) j++;
            keys = [...keys.slice(0, i), ...String(count).split(''), ...keys.slice(j)];
          }
          this.queue.unshift(...keys.map((x) => [x, 'dot']));
          return;
        }
        case 'J': {
          const times = Math.min(Math.max(1, n - 1), L.length - 1 - b.r);
          if (times <= 0) {
            this.setCur(b.r, 0);
            return;
          }
          for (let i = 0; i < times && b.r < L.length - 1; i++) {
            const curL = L[b.r];
            const nt = L[b.r + 1].replace(/^\s+/, '');
            const sep = curL.length === 0 || /\s$/.test(curL) || nt === '' || nt[0] === ')' ? '' : ' ';
            L[b.r] = curL + sep + nt;
            L.splice(b.r + 1, 1);
            b.c = curL.length + (sep ? 0 : 0) - (sep ? 0 : curL.length && !nt ? 1 : 0);
            if (sep) b.c = curL.length;
            else b.c = Math.max(0, curL.length - (nt === '' ? 1 : 0));
          }
          this.setCur(b.r, b.c);
          return;
        }
        case 'r': {
          const ch = yield 'text';
          if (ch.length !== 1) return;
          if (b.c + n > L[b.r].length) return;
          L[b.r] = L[b.r].slice(0, b.c) + ch.repeat(n) + L[b.r].slice(b.c + n);
          this.setCur(b.r, b.c + n - 1);
          return;
        }
        case '~': {
          const line = L[b.r];
          const e = Math.min(line.length, b.c + n);
          const seg = [...line.slice(b.c, e)].map((ch) => (ch === ch.toLowerCase() ? ch.toUpperCase() : ch.toLowerCase())).join('');
          L[b.r] = line.slice(0, b.c) + seg + line.slice(e);
          this.setCur(b.r, e);
          return;
        }
        case '<C-a>':
        case '<C-x>': {
          const line = L[b.r];
          const re = /-?\d+/g;
          let m;
          while ((m = re.exec(line))) {
            if (m.index + m[0].length > b.c) {
              const v = parseInt(m[0], 10) + (k === '<C-a>' ? n : -n);
              const s = String(v);
              L[b.r] = line.slice(0, m.index) + s + line.slice(m.index + m[0].length);
              this.setCur(b.r, m.index + s.length - 1);
              return;
            }
          }
          return;
        }
        case 'q': {
          if (this.recording) {
            const rec = this.recording;
            rec.keys.pop();
            this.macros[rec.reg] = rec.keys;
            this.recording = null;
            this.say('');
            return;
          }
          const rg = yield 'text';
          if (!/^[a-z]$/.test(rg)) return;
          this.recording = { reg: rg, keys: [] };
          this.noUndo = true;
          return;
        }
        case '@': {
          let rg = yield 'text';
          if (rg === '@') rg = this.lastMacro;
          if (!rg || !this.macros[rg]) return;
          this.lastMacro = rg;
          const keys = [];
          for (let i = 0; i < n; i++) keys.push(...this.macros[rg]);
          this.queue.unshift(...keys.map((x) => [x, 'macro']));
          return;
        }
        case ':': {
          const s = yield* this.prompt(':', count ? `.,.+${count - 1}` : '');
          if (s !== null) this.ex(s);
          return;
        }
        case '<C-s>':
          this.say(`"${b.name}" written`);
          this.emit('write');
          return;
        case '<A-j>':
        case '<A-k>':
          this.moveLines(b.r, b.r, k === '<A-j>' ? n : -n);
          return;
        case 'H':
        case 'L':
          this.cycleBuffer(k === 'L' ? n : -n);
          return;
        case 'K': {
          const w = this.wordUnder();
          if (w) this.popup = { r: b.r, c: b.c, text: this.hover[w.word] || `${w.word}: no hover info` };
          return;
        }
        case 'S': {
          const rg = yield* this.flashTS();
          if (!rg) return;
          const s = this.pos(rg.s),
            e = this.pos(Math.max(rg.s, rg.e - 1));
          return yield* this.visual('char', { ar: s.r, ac: s.c, r: e.r, c: e.c });
        }
        case 'z':
          yield 'cmd';
          return;
        case '<C-o>':
        case '<C-i>':
        case '<Tab>': {
          const from = k === '<C-o>' ? this.jumps : this.jumpFwd;
          const to = k === '<C-o>' ? this.jumpFwd : this.jumps;
          const j = from.pop();
          if (!j) return;
          to.push({ buf: this.buf, r: b.r, c: b.c });
          if (this.files.includes(j.buf)) this.openBuffer(j.buf);
          this.setCur(j.r, j.c);
          return;
        }
        case ' ':
          return yield* this.leader();
        case 'd':
        case 'c':
        case 'y':
        case '>':
        case '<':
        case '=':
          return yield* this.operator(k, count, reg);
        case 'g': {
          const k2 = yield 'cmd';
          if (k2 === 'c') {
            const k3 = yield 'cmd';
            if (k3 === 'o' || k3 === 'O') return yield* this.commentLine(k3 === 'o');
            return yield* this.operator('gc', count, reg, k3);
          }
          if (k2 === 'U' || k2 === 'u' || k2 === '~') return yield* this.operator('g' + k2, count, reg);
          if (k2 === 's') {
            const k3 = yield 'cmd';
            if (k3 === 'a') return yield* this.operator('gsa', count, reg);
            if (k3 === 'd' || k3 === 'r') return yield* this.surroundChange(k3);
            this.say('mini.surround: only gsa, gsd and gsr are in this game');
            return;
          }
          if (k2 === 'd') return this.gotoDef();
          if (k2 === 'r') return this.refsList();
          const m = yield* this.motion('g' + k2, count, null);
          if (m) this.moveTo(m);
          return;
        }
        case ']':
        case '[': {
          const k2 = yield 'cmd';
          const fwd = k === ']';
          if (k2 === 'd' || k2 === 'e' || k2 === 'w') return this.jumpDiag(fwd, n);
          if (k2 === ']' || k2 === '[') return this.jumpRef(fwd, n);
          if (k2 === 'b') return this.cycleBuffer(fwd ? n : -n);
          const m = yield* this.motion(k + k2, count, null);
          if (m) this.moveTo(m);
          return;
        }
        default: {
          const m = yield* this.motion(k, count, null);
          if (m) this.moveTo(m);
          else if (m === undefined) this.say(`${k} is not a command here`, true);
        }
      }
    }

    opensBlock(s) {
      const ft = this.buf.ft;
      if (/[\[{(]\s*$/.test(s)) return true;
      if (ft === 'python' && /:\s*$/.test(s)) return true;
      if (ft === 'lua' && /(\bthen|\bdo|\bfunction\b.*\))\s*$/.test(s)) return true;
      return false;
    }

    moveTo(m) {
      if (m.jump) {
        this.jumps.push({ buf: this.buf, r: this.buf.r, c: this.buf.c });
        this.jumpFwd = [];
      }
      const b = this.buf;
      const max = Math.max(0, this.L[m.r].length - 1);
      b.r = m.r;
      b.c = Math.min(m.c, this.mode === 'insert' ? this.L[m.r].length : max);
      if (m.want !== undefined) b.want = m.want;
      else if (!m.keepWant) b.want = b.c;
    }

    repeatFind(k, n) {
      const lf = this.lastFind;
      const base = lf.k;
      let use;
      if (k === base.toLowerCase()) use = base;
      else if (k === base.toUpperCase()) use = base === base.toLowerCase() ? base.toUpperCase() : base.toLowerCase();
      else return this.findChar(k, lf.ch, n, false);
      return this.findChar(use, lf.ch, n, true);
    }

    // ---------- motions ----------
    *motion(k, count, op) {
      const n = count || 1;
      const L = this.L;
      const { r, c } = this.cur;
      switch (k) {
        case 'h':
        case '<Left>':
          if (op && c === 0) return null;
          return { r, c: Math.max(0, c - n), type: 'excl' };
        case 'l':
        case '<Right>': {
          const lim = op ? L[r].length : Math.max(0, L[r].length - 1);
          return { r, c: Math.min(lim, c + n), type: 'excl' };
        }
        case 'j':
        case '<Down>':
        case 'k':
        case '<Up>': {
          const d = k === 'j' || k === '<Down>' ? n : -n;
          const nr = Math.max(0, Math.min(L.length - 1, r + d));
          if (op && nr === r) return null;
          return { r: nr, c: this.wantCol(nr), type: 'line', keepWant: true };
        }
        case '0':
        case '<Home>':
          return { r, c: 0, type: 'excl' };
        case '^':
          return { r, c: fnbCol(L[r]), type: 'excl' };
        case '$':
        case '<End>': {
          const nr = Math.min(L.length - 1, r + n - 1);
          return { r: nr, c: Math.max(0, L[nr].length - 1), type: 'incl', want: Infinity };
        }
        case 'w':
        case 'W': {
          const big = k === 'W';
          if (op === 'c' && cls(L[r][c], big) !== 0) {
            let p = { r, c };
            for (let i = 0; i < n; i++) {
              const pe = this.wordEnd(i === 0 ? { r: p.r, c: p.c - 1 } : p, big);
              p = pe;
            }
            return { r: p.r, c: p.c, type: 'incl' };
          }
          let p = { r, c };
          for (let i = 0; i < n; i++) p = op && i === n - 1 ? this.wordFwdEol(p, big) : this.wordFwd(p, big, false);
          return { r: p.r, c: p.c, type: 'excl', noLine: !!op && p.r === r };
        }
        case 'b':
        case 'B': {
          if (op && r === 0 && c === 0) return null;
          let p = { r, c };
          for (let i = 0; i < n; i++) p = this.wordBack(p, k === 'B');
          return { r: p.r, c: p.c, type: 'excl' };
        }
        case 'e':
        case 'E': {
          let p = { r, c };
          for (let i = 0; i < n; i++) p = this.wordEnd(p, k === 'E');
          return { r: p.r, c: p.c, type: 'incl' };
        }
        case 'ge':
        case 'gE': {
          let p = { r, c };
          for (let i = 0; i < n; i++) p = this.wordEndBack(p, k === 'gE');
          return { r: p.r, c: p.c, type: 'incl' };
        }
        case 'gg':
        case 'G':
        case '<C-End>': {
          const nr = count ? Math.min(L.length, count) - 1 : k === 'gg' ? 0 : L.length - 1;
          return { r: nr, c: this.wantCol(nr), type: 'line', jump: true, keepWant: true };
        }
        case 'f':
        case 'F':
        case 't':
        case 'T': {
          const ch = yield 'text';
          if (ch.length !== 1) return null;
          this.lastFind = { k, ch };
          const m = this.findChar(k, ch, n, false);
          if (!op) this.charActive = true;
          return m;
        }
        case ';':
        case ',': {
          if (!this.lastFind) return null;
          const lf = this.lastFind;
          const kk = k === ';' ? lf.k : lf.k === lf.k.toLowerCase() ? lf.k.toUpperCase() : lf.k.toLowerCase();
          if (!op) this.charActive = true;
          return this.findChar(kk, lf.ch, n, true);
        }
        case '%': {
          const line = L[r];
          let i = c;
          while (i < line.length && !'()[]{}'.includes(line[i])) i++;
          const fail = op ? { r, c, type: 'incl', nl: true } : null;
          if (i >= line.length) return fail;
          const o = this.off(r, i);
          const ch = line[i];
          const pr = this.bracketPairs(OPEN[ch] ? ch : CLOSE[ch]).find((p) => p.o === o || p.c === o);
          if (!pr) return fail;
          const t = pr.o === o ? pr.c : pr.o;
          const p = this.pos(t);
          return { r: p.r, c: p.c, type: 'incl', jump: true };
        }
        case '}':
        case '{': {
          let i = r;
          const fwd = k === '}';
          for (let t = 0; t < n; t++) {
            if (fwd) {
              if (t > 0 || L[i] === '') i++;
              while (i < L.length && L[i] === '') i++;
              while (i < L.length && L[i] !== '') i++;
              if (i >= L.length) return { r: L.length - 1, c: Math.max(0, L[L.length - 1].length - (op ? 0 : 1)), type: op ? 'excl' : 'excl', jump: true };
            } else {
              if (t > 0 || L[i] === '') i--;
              while (i > 0 && L[i] === '') i--;
              while (i > 0 && L[i] !== '') i--;
              if (i <= 0) return { r: 0, c: 0, type: 'excl', jump: true };
            }
          }
          return { r: i, c: 0, type: 'excl', jump: true };
        }
        case 'n':
        case 'N': {
          if (!this.lastSearch) return null;
          const fwd = k === 'n';
          const p = this.searchFrom(this.lastSearch, fwd, n);
          if (!p) {
            this.say('E486: Pattern not found: ' + this.lastSearch, true);
            return null;
          }
          this.hl = true;
          return { r: p.r, c: p.c, type: 'excl', jump: true };
        }
        case '*':
        case '#': {
          let w = this.wordUnder();
          let pat;
          if (w) pat = '\\<' + w.word + '\\>';
          else {
            const line = L[r];
            let s0 = c;
            while (s0 < line.length && isWS(line[s0])) s0++;
            if (s0 >= line.length) return null;
            let e0 = s0;
            while (e0 + 1 < line.length && !isWS(line[e0 + 1])) e0++;
            w = { word: line.slice(s0, e0 + 1), s: s0 };
            pat = w.word.replace(/[\\.*\[\]^$~/]/g, '\\$&');
          }
          this.lastSearch = pat;
          this.lastSearchIcase = true;
          this.hl = true;
          this.buf.c = w.s;
          const p = this.searchFrom(this.lastSearch, k === '*', n, true);
          this.buf.c = c;
          return p ? { r: p.r, c: p.c, type: 'excl', jump: true } : null;
        }
        case '/':
        case '?': {
          const s = yield* this.prompt(k);
          if (s === null) return null;
          if (s !== '') {
            this.lastSearch = s;
            this.lastSearchIcase = false;
          }
          if (!this.lastSearch) return null;
          const p = this.searchFrom(this.lastSearch, k === '/', n);
          if (!p) {
            this.say('E486: Pattern not found: ' + this.lastSearch, true);
            return null;
          }
          this.hl = true;
          return { r: p.r, c: p.c, type: 'excl', jump: true };
        }
        case 's': {
          const p = yield* this.flashJump();
          if (!p) return null;
          return { r: p.r, c: p.c, type: op ? 'incl' : 'excl', jump: true };
        }
        case ']f':
        case '[f': {
          const hs = this.fnHeaders().map((f) => f.r1);
          const t = k === ']f' ? hs.find((h) => h > r) : hs.filter((h) => h < r).pop();
          if (t === undefined) return null;
          return { r: t, c: fnbCol(L[t]), type: 'excl', jump: true };
        }
        default:
          return undefined;
      }
    }

    wordUnder() {
      const line = this.L[this.buf.r];
      let c = this.buf.c;
      while (c < line.length && !isKW(line[c])) c++;
      if (c >= line.length) return null;
      let s = c,
        e = c;
      while (s > 0 && isKW(line[s - 1])) s--;
      while (e + 1 < line.length && isKW(line[e + 1])) e++;
      return { word: line.slice(s, e + 1), s, e };
    }

    searchFrom(pat, fwd, n, inclusiveStart) {
      const re = makeRe(pat, 'g');
      if (!re) return null;
      if (this.lastSearchIcase && !re.flags.includes('i')) return this.searchFromRe(new RegExp(re.source, 'gi'), fwd, n, inclusiveStart);
      return this.searchFromRe(re, fwd, n, inclusiveStart);
    }
    searchFromRe(re, fwd, n) {
      const t = this.text();
      const all = [];
      let m;
      re.lastIndex = 0;
      while ((m = re.exec(t))) {
        all.push(m.index);
        if (m[0].length === 0) re.lastIndex++;
      }
      if (!all.length) return null;
      let at = this.off(this.buf.r, this.buf.c);
      for (let i = 0; i < n; i++) {
        let nx;
        if (fwd) nx = all.find((o) => o > at);
        else nx = [...all].reverse().find((o) => o < at);
        if (nx === undefined) {
          nx = fwd ? all[0] : all[all.length - 1];
          this.say('search hit BOTTOM, continuing at TOP');
        }
        at = nx;
      }
      return this.pos(at);
    }
    searchMatches() {
      if (!this.hl && !(this.cmdline && (this.cmdline.prefix === '/' || this.cmdline.prefix === '?'))) return [];
      const pat = this.cmdline && (this.cmdline.prefix === '/' || this.cmdline.prefix === '?') ? this.cmdline.text : this.lastSearch;
      if (!pat) return [];
      let re = makeRe(pat, 'g');
      if (!re) return [];
      if (this.lastSearchIcase && !(this.cmdline && this.cmdline.text)) re = new RegExp(re.source, 'gi');
      const out = [];
      this.L.forEach((line, r) => {
        re.lastIndex = 0;
        let m;
        while ((m = re.exec(line))) {
          if (m[0].length === 0) {
            re.lastIndex++;
            continue;
          }
          out.push({ r, c: m.index, len: m[0].length });
        }
      });
      return out;
    }

    // ---------- operators ----------
    *operator(op, count, reg, firstKey) {
      const dbl = { d: 'd', c: 'c', y: 'y', '>': '>', '<': '<', '=': '=', gc: 'c', gU: 'U', gu: 'u', 'g~': '~' }[op];
      let k = firstKey !== undefined ? firstKey : yield 'cmd';
      let c2 = 0;
      while (/^[1-9]$/.test(k) || (c2 && k === '0')) {
        c2 = c2 * 10 + +k;
        k = yield 'cmd';
      }
      const hasCount = count || c2;
      const n = (count || 1) * (c2 || 1);
      const L = this.L;
      const b = this.buf;
      let rg = null;
      if (k === 'g' || k === ']' || k === '[') {
        const k2 = yield 'cmd';
        if (op.startsWith('g') && k === 'g' && k2 === dbl) k = dbl;
        else k = k + k2;
      }
      if (k === dbl || (op.length === 2 && k === op)) {
        if (b.r + n - 1 > L.length - 1 && n > 1) return;
        rg = { kind: 'line', r1: b.r, r2: Math.min(L.length - 1, b.r + n - 1) };
      } else if (k === 'i' || k === 'a') {
        rg = yield* this.textObject(k, n);
        if (!rg && op === 'c') return yield* this.insert();
      } else if (k === 'r') {
        return yield* this.remote(op, reg);
      } else if (k === 'S') {
        rg = yield* this.flashTS();
      } else if (k === '<Esc>') {
        return;
      } else {
        const m = yield* this.motion(k, hasCount ? n : 0, op);
        if (!m) return;
        rg = this.rangeFrom(m);
        if (m.noLine && rg.kind === 'line') rg = { kind: 'char', s: this.off(b.r, b.c), e: this.off(m.r, m.c) };
      }
      if (!rg) return;
      return yield* this.applyOp(op, rg, reg);
    }

    *remote(op, reg) {
      const save = { r: this.buf.r, c: this.buf.c };
      const len0 = this.text().length;
      const saveOff = this.off(save.r, save.c);
      const t = yield* this.flashJump();
      if (!t) return;
      this.setCur(t.r, t.c);
      const k = yield 'cmd';
      let rg;
      if (k === 'i' || k === 'a') rg = yield* this.textObject(k, 1);
      else {
        const m = yield* this.motion(k, 0, op);
        if (!m) return;
        rg = this.rangeFrom(m);
      }
      if (!rg) return;
      const sAt = rg.kind === 'line' ? this.off(rg.r1, 0) : rg.s;
      yield* this.applyOp(op, rg, reg);
      if (this.mode === 'insert') return;
      let o = saveOff;
      if (sAt < saveOff) o += this.text().length - len0;
      const p = this.pos(Math.max(0, o));
      this.setCur(p.r, p.c);
    }

    *applyOp(op, rg, reg) {
      const L = this.L;
      const b = this.buf;
      switch (op) {
        case 'd':
          if (rg.kind === 'char') {
            const a = this.pos(rg.s),
              z = this.pos(rg.e);
            if (z.r > a.r && a.c <= indentOf(L[a.r]).length && L[z.r].slice(z.c).trim() === '' && rg.e > rg.s)
              rg = { kind: 'line', r1: a.r, r2: z.r, fnb: true };
          }
          this.deleteRange(rg, reg);
          return;
        case 'y': {
          this.setReg(reg, this.rangeText(rg), rg.kind === 'line', true);
          if (rg.kind === 'line') this.setCur(rg.r1, rg.r1 === b.r ? b.c : b.c, true);
          else {
            const p = this.pos(rg.s);
            this.setCur(p.r, p.c);
          }
          return;
        }
        case 'c': {
          if (rg.kind === 'line') {
            const removed = L.slice(rg.r1, rg.r2 + 1);
            this.setReg(reg, removed.join('\n'), true);
            const ind = indentOf(L[rg.r1]);
            L.splice(rg.r1, rg.r2 - rg.r1 + 1, ind);
            b.r = rg.r1;
            b.c = ind.length;
          } else {
            const t = this.text();
            this.setReg(reg, t.slice(rg.s, rg.e), false);
            this.setText(t.slice(0, rg.s) + t.slice(rg.e));
            const p = this.pos(rg.s);
            b.r = p.r;
            b.c = p.c;
          }
          return yield* this.insert();
        }
        case '>':
        case '<':
        case '=': {
          const { r1, r2 } = this.linesOf(rg);
          if (op !== '=')
            for (let i = r1; i <= r2; i++) {
              if (op === '>') {
                if (L[i].length) L[i] = '  ' + L[i];
              } else L[i] = L[i].replace(/^( {1,2}|\t)/, '');
            }
          this.setCur(rg.kind === 'line' ? b.r : r1, b.c, true);
          return;
        }
        case 'gc': {
          const { r1, r2 } = this.linesOf(rg);
          this.toggleComment(r1, r2);
          if (rg.kind === 'line' && rg.r1 === rg.r2) return;
          this.setCur(r1, b.c);
          return;
        }
        case 'gU':
        case 'gu':
        case 'g~': {
          const f = (ch) => (op === 'gU' ? ch.toUpperCase() : op === 'gu' ? ch.toLowerCase() : ch === ch.toLowerCase() ? ch.toUpperCase() : ch.toLowerCase());
          const t = this.text();
          let s, e;
          if (rg.kind === 'line') {
            s = this.off(rg.r1, 0);
            e = this.off(rg.r2, L[rg.r2].length);
          } else {
            s = rg.s;
            e = rg.e;
          }
          this.setText(t.slice(0, s) + [...t.slice(s, e)].map(f).join('') + t.slice(e));
          const p = rg.kind === 'line' ? { r: rg.r1, c: fnbCol(L[rg.r1]) } : this.pos(s);
          this.setCur(p.r, p.c);
          return;
        }
        case 'gsa': {
          const ch = yield 'text';
          const pair = yield* this.surroundPair(ch);
          if (!pair) return;
          let s, e;
          if (rg.kind === 'line') {
            s = this.off(rg.r1, 0);
            e = this.off(rg.r2, L[rg.r2].length);
          } else {
            s = rg.s;
            e = rg.e;
          }
          const t = this.text();
          this.setText(t.slice(0, s) + pair[0] + t.slice(s, e) + pair[1] + t.slice(e));
          const p = this.pos(s + pair[0].length);
          this.setCur(p.r, p.c);
          return;
        }
      }
    }
    linesOf(rg) {
      if (rg.kind === 'line') return { r1: rg.r1, r2: rg.r2 };
      const a = this.pos(rg.s),
        z = this.pos(Math.max(rg.s, rg.e - 1));
      return { r1: a.r, r2: z.r };
    }
    commentStr() {
      return COMMENT[this.buf.ft] || '#';
    }
    toggleComment(r1, r2) {
      const L = this.L;
      const cs = this.commentStr();
      const lines = [];
      for (let i = r1; i <= r2; i++) if (L[i].trim() !== '') lines.push(i);
      if (!lines.length) return;
      const all = lines.every((i) => L[i].trimStart().startsWith(cs));
      if (all) {
        for (const i of lines) {
          const ind = indentOf(L[i]);
          let rest = L[i].slice(ind.length + cs.length);
          if (rest.startsWith(' ')) rest = rest.slice(1);
          L[i] = ind + rest;
        }
      } else {
        const min = Math.min(...lines.map((i) => indentOf(L[i]).length));
        for (const i of lines) L[i] = L[i].slice(0, min) + cs + ' ' + L[i].slice(min);
      }
    }
    *commentLine(below) {
      const L = this.L;
      const b = this.buf;
      const ind = indentOf(L[b.r]);
      const at = below ? b.r + 1 : b.r;
      const pre = ind + this.commentStr() + ' ';
      L.splice(at, 0, pre);
      b.r = at;
      b.c = pre.length;
      return yield* this.insert();
    }
    moveLines(r1, r2, d) {
      const L = this.L;
      const b = this.buf;
      if (d > 0) d = Math.min(d, L.length - 1 - r2);
      else d = Math.max(d, -r1);
      if (!d) return 0;
      const block = L.splice(r1, r2 - r1 + 1);
      L.splice(r1 + d, 0, ...block);
      b.r += d;
      return d;
    }
    paste(after, n, reg) {
      const v = this.getReg(reg);
      if (!v || (!v.text && !v.line)) return;
      const L = this.L;
      const b = this.buf;
      if (v.line) {
        const lines = [];
        for (let i = 0; i < n; i++) lines.push(...v.text.split('\n'));
        const at = after ? b.r + 1 : b.r;
        L.splice(at, 0, ...lines);
        this.setCur(at, fnbCol(L[at]));
        return;
      }
      const t = this.text();
      const col = after && L[b.r].length ? b.c + 1 : b.c;
      const o = this.off(b.r, col);
      const ins = v.text.repeat(n);
      this.setText(t.slice(0, o) + ins + t.slice(o));
      const p = ins.includes('\n') ? this.pos(o) : this.pos(o + ins.length - 1);
      this.setCur(p.r, p.c);
    }

    // ---------- surround ----------
    *surroundPair(ch) {
      const P = {
        '(': ['( ', ' )'],
        ')': ['(', ')'],
        b: ['(', ')'],
        '[': ['[ ', ' ]'],
        ']': ['[', ']'],
        '{': ['{ ', ' }'],
        '}': ['{', '}'],
        B: ['{', '}'],
        '<': ['< ', ' >'],
        '>': ['<', '>'],
        q: ['"', '"'],
      };
      if (P[ch]) return P[ch];
      if (ch === 'f') {
        const name = yield* this.prompt('Function name: ');
        if (!name) return null;
        return [name + '(', ')'];
      }
      if (ch === 't') {
        const tag = yield* this.prompt('Tag name: ');
        if (!tag) return null;
        return ['<' + tag + '>', '</' + tag.split(/\s/)[0] + '>'];
      }
      if (ch.length !== 1 || ch === ' ') return null;
      return [ch, ch];
    }
    findSurround(ch, method) {
      const t = this.text();
      const at = this.off(this.buf.r, this.buf.c);
      let pairs;
      if (ch === 'f') {
        pairs = this.bracketPairs('(')
          .map((p) => {
            let s = p.o;
            while (s > 0 && /[\w.$]/.test(t[s - 1])) s--;
            return s < p.o ? { o: s, c: p.c, li: p.o + 1 } : null;
          })
          .filter(Boolean);
      } else pairs = this.pairsFor(ch);
      if (!pairs) {
        if (ch.length !== 1) return null;
        pairs = this.quotePairs(ch);
      }
      const m = method === 'cover' ? 'cover' : method;
      const p = this.pickPair(pairs, at, m);
      if (!p) return null;
      let lo = p.o,
        li = p.li || p.o + 1,
        ri = p.c,
        ro = p.c + 1;
      if (OPEN[ch] && ch !== '<') {
        while (li < ri && /\s/.test(t[li])) li++;
        while (ri > li && /\s/.test(t[ri - 1])) ri--;
      }
      return { lo, li, ri, ro };
    }
    *surroundChange(kind) {
      let ch = yield 'text';
      let method = 'cover';
      if (ch === 'n' || ch === 'l') {
        method = ch === 'n' ? 'next' : 'last';
        ch = yield 'text';
      }
      const f = this.findSurround(ch, method);
      if (!f) {
        this.say(`(mini.surround) No surrounding "${ch}" found within 20 lines and \`config.search_method = 'cover'\`.`, true);
        return;
      }
      const t = this.text();
      if (kind === 'd') {
        this.setText(t.slice(0, f.lo) + t.slice(f.li, f.ri) + t.slice(f.ro));
        const p = this.pos(f.lo);
        this.setCur(p.r, p.c);
        return;
      }
      const nch = yield 'text';
      const pair = yield* this.surroundPair(nch);
      if (!pair) return;
      this.setText(t.slice(0, f.lo) + pair[0] + t.slice(f.li, f.ri) + pair[1] + t.slice(f.ro));
      const p = this.pos(f.lo + pair[0].length);
      this.setCur(p.r, p.c);
    }

    // ---------- insert mode ----------
    *insert() {
      this.mode = 'insert';
      const b = this.buf;
      let prevJ = false;
      for (;;) {
        const k = yield 'text';
        const L = this.L;
        if (this.jk && prevJ && k === 'k' && b.c > 0 && L[b.r][b.c - 1] === 'j') {
          L[b.r] = L[b.r].slice(0, b.c - 1) + L[b.r].slice(b.c);
          b.c--;
          return this.leaveInsert();
        }
        prevJ = k === 'j';
        if (k === '<Esc>' || k === '<C-c>' || k === '<C-[>') return this.leaveInsert();
        if (k === '<C-s>') {
          this.say(`"${b.name}" written`);
          this.emit('write');
          return this.leaveInsert();
        }
        if (k !== '<CR>') this.aiLine = -1;
        if (k === '<BS>') this.backspace();
        else if (k === '<CR>') this.newline();
        else if (k === '<Tab>') this.insText('  ');
        else if (k === '<A-j>' || k === '<A-k>') this.moveLines(b.r, b.r, k === '<A-j>' ? 1 : -1);
        else if (k === '<Left>') b.c = Math.max(0, b.c - 1);
        else if (k === '<Right>') b.c = Math.min(L[b.r].length, b.c + 1);
        else if (k === '<C-w>') {
          const line = L[b.r];
          let s = b.c;
          while (s > 0 && isWS(line[s - 1])) s--;
          const kk = cls(line[s - 1]);
          while (s > 0 && cls(line[s - 1]) === kk && kk !== 0) s--;
          L[b.r] = line.slice(0, s) + line.slice(b.c);
          b.c = s;
        } else if (k.length === 1) this.typeChar(k);
      }
    }
    leaveInsert() {
      const b = this.buf;
      const L = this.L;
      if (this.aiLine === b.r && L[b.r].trim() === '') {
        L[b.r] = '';
        b.c = 0;
      }
      this.aiLine = -1;
      this.mode = 'normal';
      if (b.c > 0) b.c--;
      b.want = b.c;
    }
    insText(s) {
      const b = this.buf;
      const line = this.L[b.r];
      this.L[b.r] = line.slice(0, b.c) + s + line.slice(b.c);
      b.c += s.length;
    }
    typeChar(ch) {
      const b = this.buf;
      const line = this.L[b.r];
      const next = line[b.c];
      const prev = line[b.c - 1];
      if (this.pairs) {
        const skipNext = next !== undefined && /[\w%'\[".`$]/.test(next);
        if ('([{'.includes(ch)) {
          const close = OPEN[ch];
          let unbalanced = false;
          if (next === close) {
            const opens = line.split(ch).length - 1;
            const closes = line.split(close).length - 1;
            unbalanced = closes > opens;
          }
          if (prev !== '\\' && !skipNext && !unbalanced) {
            this.insText(ch + close);
            b.c--;
            return;
          }
        } else if (')]}'.includes(ch) && next === ch) {
          b.c++;
          return;
        } else if (QUOTES.includes(ch)) {
          if (next === ch) {
            b.c++;
            return;
          }
          const neigh = ch === "'" ? !(prev && /[A-Za-z\\]/.test(prev)) : prev !== '\\';
          const inStr = (line.slice(0, b.c).split(ch).length - 1) % 2 === 1;
          if (neigh && !skipNext && !inStr) {
            this.insText(ch + ch);
            b.c--;
            return;
          }
        }
      }
      this.insText(ch);
    }
    backspace() {
      const b = this.buf;
      const L = this.L;
      if (b.c === 0) {
        if (b.r === 0) return;
        const pl = L[b.r - 1].length;
        L[b.r - 1] += L[b.r];
        L.splice(b.r, 1);
        b.r--;
        b.c = pl;
        return;
      }
      const line = L[b.r];
      const prev = line[b.c - 1],
        next = line[b.c];
      const both = this.pairs && next !== undefined && ({ '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' }[prev] === next);
      L[b.r] = line.slice(0, b.c - 1) + line.slice(b.c + (both ? 1 : 0));
      b.c--;
    }
    newline() {
      const b = this.buf;
      const L = this.L;
      const line = L[b.r];
      const before = line.slice(0, b.c),
        after = line.slice(b.c).replace(/^\s+/, '');
      const ind = indentOf(line);
      if (this.pairs && /[\[{(]$/.test(before) && after.length && OPEN[before[before.length - 1]] === after[0]) {
        L.splice(b.r, 1, before, ind + '  ', ind + after);
        b.r++;
        b.c = ind.length + 2;
        this.aiLine = b.r;
        return;
      }
      const extra = this.opensBlock(before) ? '  ' : '';
      L.splice(b.r, 1, before, ind + extra + after);
      b.r++;
      b.c = ind.length + extra.length;
      this.aiLine = after ? -1 : b.r;
    }

    // ---------- visual mode ----------
    visRange() {
      const v = this.vis;
      const b = this.buf;
      if (v.kind === 'line') return { kind: 'line', r1: Math.min(v.ar, b.r), r2: Math.max(v.ar, b.r) };
      let a = { r: v.ar, c: v.ac },
        z = { r: b.r, c: b.c };
      if (z.r < a.r || (z.r === a.r && z.c < a.c)) [a, z] = [z, a];
      const len = this.L[z.r].length;
      const zIsCur = z.r === b.r && z.c === b.c;
      const eol = z.r < this.L.length - 1 && (len === 0 || (zIsCur && b.want >= len));
      return { kind: 'char', s: this.off(a.r, a.c), e: this.off(z.r, Math.min(len, z.c + 1)) + (eol ? 1 : 0) };
    }
    *visual(kind, preset) {
      const b = this.buf;
      this.vis = preset ? { kind, ar: preset.ar, ac: preset.ac } : { kind, ar: b.r, ac: b.c };
      if (preset) this.setCur(preset.r, preset.c);
      this.mode = kind === 'line' ? 'vline' : 'visual';
      for (;;) {
        this.mode = this.vis.kind === 'line' ? 'vline' : 'visual';
        let k = yield 'cmd';
        let count = 0;
        while (/^[1-9]$/.test(k) || (count && k === '0')) {
          count = count * 10 + +k;
          k = yield 'cmd';
        }
        const n = count || 1;
        const wasChar = this.charActive;
        this.charActive = false;
        let reg = null;
        if (k === '"') {
          reg = yield 'text';
          k = yield 'cmd';
        }
        if (wasChar && this.lastFind && k.length === 1 && 'fFtT'.includes(k) && k.toLowerCase() === this.lastFind.k.toLowerCase()) {
          const m = this.repeatFind(k, n);
          if (m) {
            this.moveTo(m);
            this.charActive = true;
          }
          continue;
        }
        if (k === '<Esc>' || k === '<C-c>') break;
        if (k === 'v' || k === 'V') {
          const nk = k === 'V' ? 'line' : 'char';
          if (nk === this.vis.kind) break;
          this.vis.kind = nk;
          continue;
        }
        if (k === 'o') {
          const { ar, ac } = this.vis;
          this.vis.ar = b.r;
          this.vis.ac = b.c;
          this.setCur(ar, ac);
          continue;
        }
        if (k === 'i' || k === 'a') {
          const rg = yield* this.textObject(k, n);
          if (!rg) continue;
          if (rg.kind === 'line') {
            this.vis.kind = 'line';
            this.vis.ar = rg.r1;
            this.vis.ac = 0;
            this.setCur(rg.r2, 0);
          } else {
            const s = this.pos(rg.s),

      if (!w || w.s > this.buf.c) return;

          let m;

      return out.sort((a, b) => a.r - b.r || a.c - b.c);
    }
    jumpDiag(fwd, n) {
      const ds = this.diagnostics();
      if (!ds.length) return this.say('No more diagnostics');
      let { r, c } = this.cur;
      let hit = null;
      for (let i = 0; i < n; i++) {

      this.setCur(hit.r, hit.c);
      this.popup = { r: hit.r, c: hit.c, text: hit.msg, sev: hit.sev };
    }

      const d = this.diagnostics().find((x) => x.r === this.buf.r);

/* LazyQuest game layer: level parsing, gems, targets, bans, scoring. Pure (no DOM). */
(function (G) {
  'use strict';
  const { Vim } = G.LazyVimEngine;
  const GLOBAL_BANNED = ['<Left>', '<Right>', '<Up>', '<Down>'];

  function tok(s) {
    const out = [];
    for (let i = 0; i < s.length; i++) {
      if (s[i] === '<') {
        const j = s.indexOf('>', i);
        const t = j > i ? s.slice(i, j + 1) : '';
        if (/^<(flash|label):/.test(t) || /^<[A-Za-z][-A-Za-z0-9]*>$/.test(t)) {
          out.push(t);
          i = j;
          continue;
        }
      }
      out.push(s[i]);
    }
    return out;
  }

  function parseText(text) {
    let cursor = null;
    const gems = [];
    const lines = text.split('\n').map((line, r) => {
      let s = '';
      for (const ch of line) {
        if (ch === '‸') cursor = [r, s.length];
        else if (ch === '¤') gems.push([r, s.length]);
        else s += ch;
      }
      return s;
    });
    return { text: lines.join('\n'), cursor, gems };
  }

  const norm = (t) =>
    t
      .split('\n')
      .map((l) => l.replace(/\s+$/, ''))
      .join('\n')
      .replace(/\n+$/, '');

  class Game {
    constructor(level, opts) {
      opts = opts || {};
      this.level = level;
      const files = level.files.map((f) => {
        const p = parseText(f.text);
        return { name: f.name, text: p.text, cursor: p.cursor || [0, 0], open: f.open, gems: p.gems };
      });
      this.gems = [];
      files.forEach((f) => f.gems.forEach(([r, c]) => this.gems.push({ file: f.name, r, c, got: false })));
      this.vim = new Vim({ files, diagnostics: level.diagnostics, hover: level.hover, jk: opts.jk });
      this.targets = {};
      for (const f of level.files) if (f.target !== undefined) this.targets[f.name] = f.target;
      this.banned = new Set([...(level.banned || []), ...GLOBAL_BANNED]);
      this.keys = 0;
      this.won = false;
      this.rejected = null;
    }
    get idle() {
      return !this.vim.gen;
    }
    press(key, counted) {
      this.rejected = null;
      if (this.won) return false;
      if (this.vim.ctx === 'cmd' && this.banned.has(key)) {
        this.rejected = key;
        return false;
      }
      if (counted !== false) this.keys++;
      this.vim.feed(key);
      this.check();
      return true;
    }
    collect() {
      const v = this.vim;
      if (!(this.idle || v.mode === 'visual' || v.mode === 'vline')) return [];
      if (v.flash || v.cmdline || v.picker) return [];
      const got = [];
      for (const g of this.gems)
        if (!g.got && g.file === v.buf.name && g.r === v.buf.r && g.c === v.buf.c) {
          g.got = true;
          got.push(g);
        }
      return got;
    }
    targetStatus() {
      const out = [];
      for (const [name, want] of Object.entries(this.targets)) {
        const bf = this.vim.files.find((f) => f.name === name);
        out.push({ name, ok: norm(bf.text()) === norm(want), want, have: bf.text() });
      }
      return out;
    }
    check() {
      this.lastGems = this.collect();
      const gemsOk = this.gems.every((g) => g.got);
      const tOk = this.targetStatus().every((t) => t.ok);
      if (gemsOk && tOk && this.idle && this.vim.mode === 'normal') this.won = true;
      return this.won;
    }
    stars(par) {
      if (this.keys <= par) return 3;
      if (this.keys <= par + Math.max(3, Math.ceil(par * 0.5))) return 2;
      return 1;
    }
  }

  // Expand a level's solution into concrete keys. <flash:pat@r:c> = s + pat + label,
  // <label:pat@r:c> = pat + label (for remote `r`). Labels come from simulating the engine.
  function expandSolution(level) {
    const g = new Game(level);
    const keys = [];
    const errors = [];
    for (const t of tok(level.solution)) {
      const m = t.match(/^<(flash|label):(.+)@(\d+):(\d+)>$/);
      if (!m) {
        keys.push(t);
        if (!g.press(t)) errors.push('rejected ' + t);
        continue;
      }
      const seq = (m[1] === 'flash' ? ['s'] : []).concat(m[2].split(''));
      for (const k of seq) {
        keys.push(k);
        g.press(k);
      }
      const fl = g.vim.flash;
      const hit = fl && fl.matches.find((x) => x.r === +m[3] && x.c === +m[4]);
      if (!hit || !hit.label) {
        errors.push(`no flash label for ${t}`);
        continue;
      }
      keys.push(hit.label);
      g.press(hit.label);
    }
    return { keys, game: g, errors };
  }

  G.LazyQuest = { Game, tok, parseText, expandSolution, GLOBAL_BANNED };
  if (typeof module !== 'undefined') module.exports = G.LazyQuest;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* LazyQuest UI: screens, editor rendering, overlays, input. */
(function () {
  'use strict';
  const { Game, tok, expandSolution } = window.LazyQuest;
  const { CHAPTERS, LEVELS } = window.LazyQuestLevels;
  const app = document.getElementById('app');

  // ---------- storage ----------
  const store = {
    get(k, d) {
      try {
        const v = localStorage.getItem('lazyquest:' + k);
        return v ? JSON.parse(v) : d;
      } catch (e) {
        return d;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem('lazyquest:' + k, JSON.stringify(v));
      } catch (e) {
        /* storage unavailable: progress lasts for this visit only */
      }
    },
  };

  const S = {
    screen: 'title',
    progress: store.get('progress', {}),
    settings: Object.assign({ jk: false, sound: true, unlockAll: false }, store.get('settings', {})),
    idx: 0,
    game: null,
    par: 0,
    solution: [],
    mapSel: 0,
    showHint: false,
    showSol: false,
    modal: null,
    focused: true,
  };
  const PARS = {};
  LEVELS.forEach((lv) => {
    try {
      PARS[lv.id] = expandSolution(lv).keys.length;
    } catch (e) {
      PARS[lv.id] = 99;
    }
  });

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const unlocked = (i) => S.settings.unlockAll || i === 0 || !!S.progress[LEVELS[i - 1].id];
  const starsHtml = (n, total = 3) => `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(total - n)}</span></span>`;
  const totalStars = () => Object.values(S.progress).reduce((a, p) => a + (p.stars || 0), 0);
  const keyLabel = (k) =>
    ({ ' ': 'Space', '<Esc>': 'Esc', '<CR>': 'Enter', '<BS>': 'Bksp', '<Tab>': 'Tab', '<C-r>': 'Ctrl-r', '<C-u>': 'Ctrl-u', '<A-j>': 'Alt-j', '<A-k>': 'Alt-k', '<C-o>': 'Ctrl-o' }[k] ||
    k.replace(/^<C-(.)>$/, 'Ctrl-$1').replace(/^<A-(.)>$/, 'Alt-$1'));
  const kc = (s) => `<span class="kc">${esc(s)}</span>`;
  const teachKey = (s) =>
    s
      .replace(/<leader>/g, '␣')
      .replace(/<space>/g, '␣')
      .replace(/<CR>/g, '⏎')
      .replace(/<Esc>/g, 'Esc')
      .replace(/<BS>/g, 'Bksp')
      .replace(/<C-(.)>/g, 'Ctrl-$1')
      .replace(/<A-(.)>/g, 'Alt-$1');

  // ---------- sound ----------
  let actx = null;
  function beep(kind) {
    if (!S.settings.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = { gem: [880, 1320], win: [523, 659, 784, 1047], nope: [180], step: [] }[kind] || [];
      notes.forEach((f, i) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = kind === 'nope' ? 'sawtooth' : 'square';
        o.frequency.value = f;
        const t0 = actx.currentTime + i * 0.08;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 'win' ? 0.22 : 0.12));
        o.connect(g).connect(actx.destination);
        o.start(t0);
        o.stop(t0 + 0.25);
      });
    } catch (e) {
      /* audio not available */
    }
  }

  // ---------- owl sprite ----------
  const OWL = ['..O....O..', '.OOOOOOOO.', 'OOWWOOWWOO', 'OWEWOOWEWO', 'OOWWOYWWOO', '.OOOYYOOO.', '.OBBBBBBO.', '.OBBBBBBO.', '..OO..OO..', '..YY..YY..'];
  const OWLC = { O: '#bb9af7', W: '#c0caf5', E: '#1a1b26', Y: '#e0af68', B: '#9d7cd8' };
  const owlSvg = `<svg class="owl" viewBox="0 0 10 10" aria-hidden="true">${OWL.map((row, y) =>
    [...row].map((ch, x) => (OWLC[ch] ? `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${OWLC[ch]}"/>` : '')).join('')
  ).join('')}</svg>`;

  // ---------- syntax highlight ----------
  const KW = {
    javascript: 'const let var function return if else for of in while new import from export async await class this true false null undefined typeof',
    typescript: 'const let var function return if else for of in while new import from export async await class this true false null undefined typeof',
    python: 'def return if else elif for in while import from class pass True False None and or not with as lambda print',
    lua: 'local function end if then else elseif for do while return nil true false and or not',
    toml: 'true false',
  };
  const KWS = Object.fromEntries(Object.entries(KW).map(([k, v]) => [k, new Set(v.split(' '))]));
  function highlight(line, ft) {
    const cls = new Array(line.length).fill('');
    const fill = (s, e, c) => {
      for (let i = s; i < e && i < line.length; i++) cls[i] = c;
    };
    if (ft === 'markdown') {
      if (/^#/.test(line)) fill(0, line.length, 't-head');
      else {
        const m = line.match(/^(\s*[-*] )(\[[ x]\])?/);
        if (m) {
          fill(0, m[1].length, 't-punc');
          if (m[2]) fill(m[1].length, m[0].length, 't-kw');
        }
      }
      return cls;
    }
    if (ft === 'log') {
      const re = /\[[\d:]+\]|ERROR|WARN|INFO/g;
      let m;
      while ((m = re.exec(line))) fill(m.index, m.index + m[0].length, m[0][0] === '[' ? 't-num' : m[0] === 'ERROR' ? 't-err' : m[0] === 'WARN' ? 't-warn' : 't-info');
      return cls;
    }
    if (ft === 'text') return cls;
    const cm = { javascript: '//', typescript: '//', python: '#', lua: '--', toml: '#', sh: '#' }[ft];
    const kw = KWS[ft] || new Set();
    let i = 0;
    while (i < line.length) {
      const ch = line[i];
      if (cm && line.startsWith(cm, i)) {
        fill(i, line.length, 't-com');
        break;
      }
      if ('"\'`'.includes(ch)) {
        let j = i + 1;
        while (j < line.length && line[j] !== ch) j += line[j] === '\\' ? 2 : 1;
        fill(i, j + 1, 't-str');
        i = j + 1;
        continue;
      }
      if (/[0-9]/.test(ch) && !/[\w$]/.test(line[i - 1] || '')) {
        let j = i;
        while (j < line.length && /[0-9.]/.test(line[j])) j++;
        fill(i, j, 't-num');
        i = j;
        continue;
      }
      if (/[A-Za-z_$]/.test(ch)) {
        let j = i;
        while (j < line.length && /[\w$]/.test(line[j])) j++;
        const w = line.slice(i, j);
        if (kw.has(w)) fill(i, j, 't-kw');
        else if (line[j] === '(') fill(i, j, 't-fn');
        else if (line[i - 1] === '.') fill(i, j, 't-prop');
        i = j;
        continue;
      }
      if ('()[]{}'.includes(ch)) cls[i] = 't-brk';
      else if (/[=+\-*/<>!&|:;,.%]/.test(ch)) cls[i] = 't-op';
      i++;
    }
    return cls;
  }

  // ---------- which-key tables ----------
  const NI = null; // shown dimmed: real LazyVim key that this game does not simulate
  const WK = {
    ' ': [
      ['␣', 'Find Files'],
      [',', 'Switch Buffer'],
      ['`', 'Other Buffer'],
      ['b', '+buffer', 1],
      ['c', '+code', 1],
      ['f', '+file/find', 1],
      ['q', '+quit/session', 1],
      ['s', '+search', 1],
      ['e', 'Explorer', NI],

    ],
    ' b': [

    ],
    ' c': [

    ],
    ' q': [['q', 'Quit All (back to map)']],
    ' s': [['g', 'Grep', NI], ['w', 'Word', NI], ['r', 'Search and Replace', NI]],
    g: [
      ['g', 'First Line'],
      ['d', 'Goto Definition'],
      ['r', 'References'],
      ['c', '+comment', 1],
      ['s', '+surround', 1],
      ['U', 'Uppercase'],
      ['u', 'Lowercase'],

    ],
    gs: [

    ],
    gc: [

      ['O', 'Add Comment Above'],
      ['j', '…or any motion'],
    ],
    ']': [
      ['d', 'Next Diagnostic'],
      ['e', 'Next Error'],

      ['f', 'Next Function Start'],
      ['b', 'Next Buffer'],
      ['q', 'Next Quickfix', NI],
    ],
